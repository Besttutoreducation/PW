    // หมายเหตุ: เนื่องจากข้อความในแชทมีขีดจำกัด ผมแนะนำให้ใช้สูตร Excel ที่เคยให้ 
    // เพื่อนำข้อมูลทั้ง 539 คนมาวางลงใน [ ] ด้านบนนี้ครับ

    function check() {
        const nInput = document.getElementById('nameIn').value.replace(/\s+/g, '').trim();
        const tInput = document.getElementById('taxIn').value.trim();
        const res = document.getElementById('result');

        const found = db.find(r => r[0] === nInput && r[1] === tInput);

        res.style.display = 'block';
        if (found) {
            res.className = 'success';
            res.innerHTML = `พบข้อมูล!<br>รหัสผ่านของคุณคือ:<br><span class="pw">${found[2]}</span>`;
        } else {
            res.className = 'error';
            res.innerText = 'ไม่พบข้อมูล กรุณาตรวจสอบชื่อหรือเลขท้าย 4 ตัวอีกครั้ง';
        }
    }

    // Canvas Background Animation
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let offset = 0;
    function render() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        for (let i = 0; i < 7; i++) {
            ctx.beginPath();
            ctx.strokeStyle = `hsla(${offset + (i * 40)}, 80%, 85%, 0.5)`;
            ctx.lineWidth = 150;
            ctx.moveTo(0, canvas.height * 0.1 + (i * 100));
            for (let x = 0; x <= canvas.width; x += 15) {
                const y = Math.sin(x * 0.002 + (offset * 0.005) + i) * 60 + (canvas.height * 0.4);
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        offset++;
        requestAnimationFrame(render);
    }
    render();
</script>
