    animation: floatUp linear infinite;
    pointer-events: none;
  }

  }

    border: 1.5px solid rgba(255,255,255,0.9);
    border-radius: 28px;
    padding: 48px 40px;
    width: 100%;
    max-width: 480px;
    box-shadow:

    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg,

    animation: rainbowSlide 4s linear infinite;
    border-radius: 28px 28px 0 0;
  }

  @keyframes rainbowSlide {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .logo-wrap {

    margin-bottom: 32px;
    margin-top: 8px;
  }

  .logo-icon {

    height: 72px;

    background-size: 300% 300%;
    animation: rainbowBg 6s ease infinite;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 32px;
    box-shadow: 0 6px 20px rgba(255,107,157,0.25);

    50%      { background-position: 100% 50%; }

  }

  .tag {

    border-radius: 20px;
    padding: 3px 14px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: 0.5px;

  .divider {

  .form-group {

  }

    gap: 6px;

    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
    text-transform: uppercase;

  .label-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .dot-pink  { background: #ff6b9d; }
  .dot-blue  { background: #4d96ff; }

  input {
    width: 100%;
    background: #fafafe;

    border-radius: 14px;
    color: #333;
    font-size: 15px;
    padding: 14px 16px;

    transition: all 0.25s;

  .hint {

    font-size: 12px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;

  .btn {

    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;

    letter-spacing: 0.5px;
    margin-top: 8px;

    text-shadow: 0 1px 3px rgba(0,0,0,0.15);

    0%,80%,100% { transform: scale(1); opacity:0.6; }

  }

  @media (max-width: 480px) {
    .card { padding: 36px 20px; }

  }
</style>

function normalize(str) {
  return str.trim().replace(/\s+/g, ' ');
}

function searchPassword() {
  const nameRaw = document.getElementById('nameInput').value;
  const taxRaw  = document.getElementById('taxInput').value.trim();
  const resultBox = document.getElementById('resultBox');

  const name = normalize(nameRaw);
  const tax  = taxRaw;

  if (!name) {
    showError('กรุณากรอกชื่อ - นามสกุล', '');
    return;
  }
  if (taxRaw.length !== 4 || !/^\d{4}$/.test(taxRaw)) {
    showError('กรุณากรอกเลขผู้เสียภาษี 4 หลักให้ครบถ้วน', 'ตัวอย่าง: 1234');
    return;
  }

  const match = DB.find(r =>
    normalize(r.name).toLowerCase() === name.toLowerCase() &&
    r.tax_last4 === tax
  );

  if (match) {
    showSuccess(match);
  } else {
    showError(
      'ไม่พบข้อมูล กรุณาตรวจสอบอีกครั้ง',
      'ชื่อ-นามสกุล หรือ เลขผู้เสียภาษีอาจไม่ถูกต้อง'
    );
  }
}

function showSuccess(record) {
  const box = document.getElementById('resultBox');
  box.className = 'result show';
  box.innerHTML = `
    <div class="result-success">
      <div class="result-label">✅ พบข้อมูลเรียบร้อย</div>
      <div class="result-name">👤 ${record.name}</div>
      <div class="password-display">
        <span class="password-value" id="pwVal">${record.password}</span>
        <button class="copy-btn" onclick="copyPW('${record.password}')" id="copyBtn">📋 คัดลอก</button>
      </div>
    </div>
  `;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function showError(msg, sub) {
  const box = document.getElementById('resultBox');
  box.className = 'result show';
  box.innerHTML = `
    <div class="result-error">
      <div class="err-icon">🌧️</div>
      <div class="err-title">${msg}</div>
      ${sub ? `<div class="err-msg">${sub}</div>` : ''}
    </div>
  `;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyPW(pw) {
  navigator.clipboard.writeText(pw).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ คัดลอกแล้ว!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 คัดลอก';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = pw;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchPassword();
});

document.getElementById('taxInput').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '').slice(0, 4);
});
</script>
